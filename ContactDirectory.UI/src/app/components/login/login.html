<div class="login-container">
  <div class="login-card">
    <h2>{{ isRegisterMode ? 'Kayıt Ol' : 'Giriş Yap' }}</h2>
    
    <div *ngIf="errorMessage" class="alert error">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="alert success">{{ successMessage }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Kullanıcı Adı</label>
        <input type="text" [(ngModel)]="username" name="username" required placeholder="Kullanıcı adınızı girin">
      </div>

      <div class="form-group">
        <label>Şifre</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="Şifrenizi girin">
      </div>

      <button type="submit" class="btn-submit">
        {{ isRegisterMode ? 'Kayıt Ol' : 'Giriş Yap' }}
      </button>
    </form>

    <p class="toggle-text" (click)="toggleMode()">
      {{ isRegisterMode ? 'Zaten hesabın var mı? Giriş yap' : 'Hesabın yok mi? Kayıt ol' }}
    </p>
  </div>
</div>
