<div class="admin-layout">
  <p-toast position="top-right" />

  <!-- Topbar Header -->
  <app-topbar title="Yönetici Paneli" badgeText="Sistem & Denetim">
    <ng-container actions>
      <button class="btn-nav-contacts" (click)="goToContacts()" title="Rehbere Dön">
        <i class="pi pi-arrow-left"></i>
        <span>Rehbere Dön</span>
      </button>
      <div class="admin-badge-tag" title="Aktif Yönetici">
        <i class="pi pi-shield"></i>
        <span>{{ currentUsername() }} (Admin)</span>
      </div>
      <button class="btn-logout" (click)="logout()" title="Çıkış Yap">
        <i class="pi pi-power-off"></i>
      </button>
    </ng-container>
  </app-topbar>

  <!-- Main Content Body -->
  <main class="admin-main">
    <!-- Stat Cards Row -->
    <div class="metrics-grid">
      <!-- Total Users -->
      <div class="metric-card metric-users" (click)="setActiveTab('users')" style="cursor: pointer;" title="Kullanıcı Yönetimine Geç">
        <div class="metric-icon">
          <i class="pi pi-users"></i>
        </div>
        <div class="metric-content">
          <span class="metric-number">{{ stats()?.totalUsers ?? '-' }}</span>
          <span class="metric-label">Toplam Kullanıcı</span>
          <span class="metric-sub">Sisteme kayıtlı hesaplar</span>
        </div>
      </div>

      <!-- Total Contacts -->
      <div class="metric-card metric-contacts">
        <div class="metric-icon">
          <i class="pi pi-address-book"></i>
        </div>
        <div class="metric-content">
          <span class="metric-number">{{ stats()?.totalContacts ?? '-' }}</span>
          <span class="metric-label">Toplam Rehber Kaydı</span>
          <span class="metric-sub">Tüm kullanıcılara ait kişiler</span>
        </div>
      </div>

      <!-- Total Activity Logs -->
      <div class="metric-card metric-logs" (click)="setActiveTab('logs')" style="cursor: pointer;" title="İşlem Geçmişine Geç">
        <div class="metric-icon">
          <i class="pi pi-history"></i>
        </div>
        <div class="metric-content">
          <span class="metric-number">{{ stats()?.totalLogs ?? '-' }}</span>
          <span class="metric-label">Toplam İşlem Kaydı</span>
          <span class="metric-sub">Denetim günlüğü kayıtları</span>
        </div>
      </div>
    </div>

    <!-- Segmented Tab Navigation Bar -->
    <div class="admin-tab-bar">
      <button 
        type="button"
        class="admin-tab-btn" 
        [class.active]="activeTab() === 'users'" 
        (click)="setActiveTab('users')">
        <i class="pi pi-id-card"></i>
        <span>Kullanıcı & Yetki Yönetimi</span>
        <span class="tab-badge" *ngIf="stats()?.totalUsers !== undefined">{{ stats()?.totalUsers }}</span>
      </button>

      <button 
        type="button"
        class="admin-tab-btn" 
        [class.active]="activeTab() === 'logs'" 
        (click)="setActiveTab('logs')">
        <i class="pi pi-list-check"></i>
        <span>İşlem Geçmişi (Audit Logs)</span>
        <span class="tab-badge" *ngIf="stats()?.totalLogs !== undefined">{{ stats()?.totalLogs }}</span>
      </button>
    </div>

    <!-- Active Tab Component Views -->
    <div class="tab-view-container">
      <!-- Tab 1: User Management Component -->
      <app-user-management 
        *ngIf="activeTab() === 'users'"
        [users]="stats()?.userSummaries || []"
        [isLoading]="isLoadingStats()"
        (roleChanged)="loadStats()">
      </app-user-management>

      <!-- Tab 2: Audit Logs Component -->
      <app-audit-logs 
        *ngIf="activeTab() === 'logs'"
        [users]="stats()?.userSummaries || []"
        (refreshRequested)="loadStats()">
      </app-audit-logs>
    </div>
  </main>
</div>
